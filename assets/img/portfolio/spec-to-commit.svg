  </text>

  <line x1="400" y1="290" x2="400" y2="345" stroke="#334155" stroke-width="1"/>

  <text x="480" y="310" text-anchor="middle" font-family="'Raleway', sans-serif" font-weight="700" font-size="22" fill="#fbbf24">
    Zero
  </text>
  <text x="480" y="335" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" fill="#94a3b8">
