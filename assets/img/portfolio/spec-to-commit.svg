  </text>

  <line x1="220" y1="290" x2="220" y2="345" stroke="#334155" stroke-width="1"/>

  <text x="310" y="310" text-anchor="middle" font-family="'Raleway', sans-serif" font-weight="700" font-size="22" fill="#38bdf8">
