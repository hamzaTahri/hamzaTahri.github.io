<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="vkmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="vkmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="vkmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#vkmBg)"/>
  <rect x="2" y="2" width="596" height="396" rx="14" fill="none" stroke="#233554" stroke-width="2"/>

  <!-- Grid decoration -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>

  <!-- Title Pill -->
  <rect x="40" y="30" width="215" height="30" rx="15" fill="#132f4c" stroke="#38bdf8" stroke-width="1"/>
  <text x="147" y="50" text-anchor="middle" font-family="'Open Sans', sans-serif" font-weight="600" font-size="12" fill="#38bdf8" letter-spacing="1">
    CONNECTED VEHICLE IoT
  </text>

  <!-- Cloud Box -->
  <rect x="50" y="90" width="220" height="150" rx="10" fill="#172a45" stroke="#0d9488" stroke-width="2"/>
  <text x="160" y="125" text-anchor="middle" font-family="'Raleway', sans-serif" font-weight="700" font-size="16" fill="#64ffda">
    Renault Cloud Backend
  </text>
  <text x="160" y="150" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    • Virtual Key Manager (VKM)
  </text>
  <text x="160" y="172" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    • Spring Integration &amp; Kafka
  </text>
  <text x="160" y="194" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    • Zero-Trust PKI Security
  </text>
  <text x="160" y="216" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" fill="#38bdf8">
    Sub-200ms Telemetry Stream
  </text>

  <!-- Exchange arrows -->
  <g stroke="url(#vkmAccent)" stroke-width="2" fill="none">
    <path d="M270 150 L330 150" marker-end="url(#arrow)"/>
    <path d="M330 180 L270 180"/>
  </g>
  <text x="300" y="132" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="8" fill="#38bdf8">
    <tspan x="300" dy="0">mTLS</tspan>
    <tspan x="300" dy="9">&amp; PKI</tspan>
  </text>
  <text x="300" y="192" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="8" fill="#64ffda">
    <tspan x="300" dy="0">Async</tspan>
    <tspan x="300" dy="9">Kafka</tspan>
  </text>

  <!-- Vehicle Box -->
  <rect x="330" y="90" width="220" height="150" rx="10" fill="#172a45" stroke="#38bdf8" stroke-width="2"/>
  <text x="440" y="125" text-anchor="middle" font-family="'Raleway', sans-serif" font-weight="700" font-size="16" fill="#38bdf8">
    Vehicle Telematics Edge
  </text>
  <text x="440" y="150" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    • Cryptographic Key Pairing
  </text>
  <text x="440" y="172" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    • Remote Lock / Unlock
  </text>
  <text x="440" y="194" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    • Telemetry Dispatch
  </text>
  <text x="440" y="216" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" fill="#64ffda">
    Zero-Trust Verification
  </text>

  <!-- Bottom Stats Bar -->
  <rect x="50" y="270" width="500" height="90" rx="10" fill="#0f1f38" stroke="#233554" stroke-width="1.5"/>
  <text x="130" y="305" text-anchor="middle" font-family="'Raleway', sans-serif" font-weight="700" font-size="22" fill="#64ffda">
    &lt;200ms
  </text>
  <text x="130" y="330" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    Roundtrip Latency
  </text>

  <line x1="210" y1="285" x2="210" y2="345" stroke="#233554" stroke-width="1"/>

  <text x="300" y="305" text-anchor="middle" font-family="'Raleway', sans-serif" font-weight="700" font-size="22" fill="#38bdf8">
    Zero-Trust
  </text>
  <text x="300" y="330" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    Cryptographic PKI
  </text>

  <line x1="390" y1="285" x2="390" y2="345" stroke="#233554" stroke-width="1"/>

  <text x="470" y="305" text-anchor="middle" font-family="'Raleway', sans-serif" font-weight="700" font-size="22" fill="#fbbf24">
    GCP &amp; K8s
  </text>
  <text x="470" y="330" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="12" fill="#8892b0">
    Cloud Native Fleet
  </text>
</svg>